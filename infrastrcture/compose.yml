services:

  redis:
    image: redis:8
    ports: 
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
  
  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

volumes:
  redis-data: