[project]
name = "iotdashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "django>=5.2.7",
    "django-cors-headers>=4.9.0",
    "django-rest>=0.8.7",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "openai>=2.6.1",
    "paho-mqtt>=2.1.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "redis>=7.0.1",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.2",
]

[tool.uv.workspace]
members = [
    "db_migrations",
    "iotDashboard",
    "services/gpt_service",
]
