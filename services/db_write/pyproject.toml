[project]
name = "db-write"
version = "0.1.0"
description = "Database writer service that reads from Redis streams and writes to PostgreSQL/TimescaleDB"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "redis>=6.4.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "fakeredis>=2.0.0",
    "pytest-asyncio>=0.21.0",
]
